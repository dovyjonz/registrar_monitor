name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python 3.13
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13.5

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

  frontend-worker:
    name: Frontend and Worker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            workers/preview-images/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Unit tests
        run: npm --prefix frontend run test:unit

      - name: Build
        run: npm --prefix frontend run build

      - name: Install Worker dependencies
        run: npm ci --prefix workers/preview-images

      - name: Check Worker
        run: npm --prefix workers/preview-images run check

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect frontend or website changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(frontend/|src/registrarmonitor/website/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend or website changes; skipping browser smoke."
          fi

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        if: steps.changes.outputs.run == 'true'
        run: uv python install 3.13.5

      - name: Install Python dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --locked --group dev

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci --prefix frontend

      - name: Install Chromium
        if: steps.changes.outputs.run == 'true'
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Browser smoke
        if: steps.changes.outputs.run == 'true'
        run: make test-browser

      - name: Upload Playwright report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: output/playwright/
          if-no-files-found: warn
