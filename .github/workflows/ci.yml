name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python 3.13 canonical checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install canonical Python
        run: uv python install 3.13.5

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Test
        run: |
          mkdir -p output/tests
          uv run pytest \
            --junitxml=output/tests/pytest-3.13.xml \
            --cov-report=xml:output/tests/coverage-3.13.xml \
            --cov-report=term-missing

      - name: Upload Python test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-3.13-test-reports
          path: output/tests/
          if-no-files-found: error

  python-3-14:
    name: Python 3.14 compatibility
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install compatibility Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14 --locked --group dev

      - name: Test compatibility
        run: |
          mkdir -p output/tests
          uv run --python 3.14 python --version
          uv run --python 3.14 pytest \
            --junitxml=output/tests/pytest-3.14.xml \
            --cov-report=xml:output/tests/coverage-3.14.xml \
            --cov-report=term-missing

      - name: Upload compatibility test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-3.14-test-reports
          path: output/tests/
          if-no-files-found: error

  website:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assets/website

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: assets/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run pure JavaScript unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  generated-site:
    name: Generated output crawl and Chromium smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13.5

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: assets/website/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix assets/website

      - name: Install browsers
        run: npm --prefix assets/website exec playwright install --with-deps chromium webkit

      - name: Seed deterministic smoke data
        run: uv run python scripts/seed_smoke_data.py

      - name: Generate and crawl production output
        run: make site-smoke

      - name: Run Playwright against generated output
        run: npm --prefix assets/website run test:e2e

      - name: Run focused Mobile Safari regressions
        run: npm --prefix assets/website run test:e2e:webkit

      - name: Prove affected browser regressions are stable
        run: make test-browser-stability

      - name: Upload generated-site and Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-smoke-reports
          path: |
            output/generated-site-crawl.json
            output/playwright/
          if-no-files-found: warn

  dependency-review:
    name: Dependency and security review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            assets/website/package-lock.json
            workers/preview-images/package-lock.json

      - name: Audit npm lockfiles
        run: make security

  preview-worker:
    name: Preview Worker checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: workers/preview-images/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix workers/preview-images

      - name: Check Worker
        run: make worker-check

  benchmark:
    name: Synthetic performance benchmark artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python and dependencies
        run: |
          uv python install 3.13.5
          uv sync --locked --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: assets/website/package-lock.json

      - name: Install frontend dependencies and Chromium
        run: |
          npm ci --prefix assets/website
          npm --prefix assets/website exec playwright install chromium

      - name: Record short synthetic benchmark
        run: make benchmark-synthetic PERF_COLD=1 PERF_WARM=2

      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline-synthetic
          path: |
            output/performance-baseline.json
            output/benchmark-browser/
          if-no-files-found: warn
