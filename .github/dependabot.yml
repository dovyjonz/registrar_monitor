version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /assets/website
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /workers/preview-images
    # The Cloudflare test pool currently requires Vitest 4. Review major
    # upgrades together with a pool release that supports them.
    ignore:
      - dependency-name: vitest
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
    groups:
      preview-worker-development:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
