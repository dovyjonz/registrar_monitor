[project]
name = "registrar-monitor"
version = "0.1.0"
description = "Monitor registrar enrollment snapshots, reports, and website dashboards."
readme = "README.md"
requires-python = ">=3.13,<3.15"
keywords = ["registrar", "enrollment", "monitoring", "sqlite", "telegram"]
dependencies = [
    "toml",
    "xlrd",
    "python-telegram-bot",
    "fpdf",
    "httpx",
    "types-toml>=0.10.8.20240310",
    "python-dotenv>=1.2.2",
    "jinja2>=3.1.6",
]

[project.scripts]
monitor = "registrarmonitor.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registrarmonitor"]

[tool.uv]
package = true

[tool.ty.environment]
extra-paths = ["scripts", "src"]

[tool.ty.rules]
all = "error"
missing-type-argument = "ignore"
missing-override-decorator = "ignore"
possibly-unresolved-reference = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=src/registrarmonitor",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
asyncio_mode = "strict"
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "ty==0.0.64",
    "types-fpdf2==2.8.4.20260724",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Start from Ruff's complete catalog so new bug- and security-focused checks are
# enabled as Ruff adds them. The exclusions below are deliberately limited to
# documentation, annotation, naming, and broad legacy-refactor preferences.
select = ["ALL"]
ignore = [
    "ANN",    # gradual typing is enforced by Ty instead
    "ARG",    # callback and framework signatures commonly need unused arguments
    "ASYNC",  # async I/O migration needs an application-wide library choice
    "B007",   # tuple-unpacking readability preference
    "B904",   # legacy configuration exception preserves its existing public API
    "BLE",    # boundary handlers intentionally report broad failures
    "C90",    # complexity thresholds require design work, not a lint-only change
    "C4",     # collection micro-optimizations require benchmarked refactors
    "COM",    # Ruff's formatter owns comma layout
    "CPY",    # no project-wide copyright-header policy
    "D",      # docstring style is not a correctness signal
    "DTZ",    # snapshot timestamps intentionally preserve registrar-local naive values
    "E501",   # Ruff's formatter owns line wrapping
    "EM",     # exception-message construction is stylistic
    "ERA",    # commented-out code needs human review
    "EXE",    # executable bits are managed by version control
    "FBT",    # public API compatibility uses positional booleans
    "FIX",    # TODO policy belongs in issue tracking
    "G004",   # existing logging API uses f-strings consistently
    "G201",   # existing error logging carries explicit context
    "INP",    # utility scripts intentionally are not packages
    "ISC001", # Ruff formatter may legitimately produce implicit concatenation
    "N",      # preserve established public names
    "PLC0415", # local imports avoid optional-dependency and cycle issues
    "PLC0207", # split-limit micro-optimization is not a correctness concern
    "PLR",    # refactoring-sized complexity and magic-number work
    "PLW",    # warning-level pylint preferences are not correctness issues
    "PERF",   # performance rewrites need measurement before enforcement
    "PTH",    # pathlib migration is a broad API refactor
    "Q",      # Ruff formatter owns quote layout
    "RET",    # return-layout preferences are stylistic
    "RUF001", # user-facing emoji and mathematical symbols are intentional
    "RUF012", # legacy tables are immutable by convention
    "RUF022",
    "RUF059",
    "RUF043", # test patterns intentionally exercise regular-expression matching
    "S110",   # best-effort cleanup can intentionally suppress failures
    "S112",
    "S501",   # registrar endpoint compatibility currently requires this setting
    "S603",
    "S607",
    "S608",   # SQL identifiers are application-controlled, not user input
    "S324",   # MD5 is used solely for non-security static-asset checksums
    "SLF",    # internal implementation tests legitimately inspect state
    "SIM",    # simplifications are readability preferences in established flows
    "T20",    # command-line utilities intentionally print
    "TC",     # runtime annotation imports are deliberate for this Python version
    "TD",     # TODO metadata is tracked outside lint
    "TID",    # package-relative imports are the established project convention
    "TRY201",
    "TRY002", # legacy public API raises Exception for configuration failures
    "TRY003", # project exceptions carry contextual messages at call sites
    "TRY300",
    "TRY301",
    "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "S101", "S105", "S108"]
