# Configuration file for Registrar Monitor
timezone = "Asia/Almaty"

[directories]
text_reports = "assets/changes"
data_storage = "data"
raw_downloads = "assets/downloads"
input_files = "assets/input"
logs = "logs"
telegram_bot_state = "data/telegram_bot.db"

[data_source]
# Compatibility exception for the registrar's currently unverifiable TLS chain.
# Remove this after configuring and proving a working ca_bundle path.
allow_insecure_tls = true

[notifications]
# File write delay before sending notifications (seconds)
file_write_delay = 3
# Enable/disable dry run mode
dry_run = false

[website]
# Update interval in minutes
update_interval = 30
# Maximum time allowed for a website generation child process (seconds).
generation_timeout_seconds = 3600
# Cloudflare Pages project name
pages_project_name = "registrar-monitor"
# Base URL for canonical links and social sharing (default: https://{pages_project_name}.pages.dev)
base_url = ""
# Separate Worker origin for state-addressed social preview images.
preview_base_url = "https://registrar-monitor-preview-images.spooktaken.workers.dev"

# Production checkpointed-state rollout control. Change one semester only
# after its migration/shadow gate is approved; DatabaseManager rejects a
# configured database whose persisted mode disagrees with this table.
[storage]
migration_order = [
    "Summer 2025",
    "Spring 2025",
    "Fall 2025",
    "Spring 2026",
    "Summer 2026",
]

[storage.semesters."Summer 2025"]
metadata_mode = "raw-enriched"
mode = "finalized"

[storage.semesters."Spring 2025"]
metadata_mode = "legacy-preserving"
mode = "finalized"

[storage.semesters."Fall 2025"]
metadata_mode = "legacy-preserving"
mode = "finalized"

[storage.semesters."Spring 2026"]
metadata_mode = "legacy-preserving"
mode = "finalized"

[storage.semesters."Summer 2026"]
metadata_mode = "raw-enriched"
mode = "finalized"

[storage.semesters."Fall 2026"]
# Fresh-semester qualification is complete; it remains outside the historical
# migration order and uses v2 reads with the atomic compatibility write path.
metadata_mode = "legacy-preserving"
mode = "v2"

[telegram]
# Bot token and chat ID are loaded from TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID in the environment or a local .env file.
bot_token = ""
chat_id = ""

[telegram_bot]
# TELEGRAM_BOT_TEST_USER_ID is environment-only and shows /test diagnostics to
# one operator. It does not restrict ordinary interactions or delivery.
retry_base_seconds = 5
retry_max_seconds = 900
per_chat_interval_seconds = 1
global_rate_per_second = 25
cleanup_interval_seconds = 3600
completed_batch_days = 90
inactive_user_days = 180

[health_monitor]
# Independent systemd health checks for the scheduler and private bot services.
interval_seconds = 30
# Require consecutive unhealthy observations before sending an outage alert.
unhealthy_checks_before_alert = 2

# ==============================================================================
