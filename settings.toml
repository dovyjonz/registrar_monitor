# Configuration file for Registrar Monitor
timezone = "Asia/Almaty"

[directories]
text_reports = "data/changes"
data_storage = "data"
raw_downloads = "data/downloads"
logs = "logs"
telegram_bot_state = "data/telegram_bot.db"

[data_source]
# PEM file with the registrar's intermediate and root certificates, written by
# scripts/fetch_registrar_ca.sh. If unset, default system verification is used.
# TLS verification is never disabled.
ca_bundle = "data/registrar-chain.pem"

[notifications]
# Enable/disable dry run mode
dry_run = false

[website]
# Maximum time allowed for a website generation child process (seconds).
generation_timeout_seconds = 3600
# Memory cap for the website build and deploy children, which run in their own
# systemd scope so an out-of-memory kill cannot take the poller with it.
build_memory_max = "600M"
# Public origin of the site Worker (workers/site), used for canonical links, Open
# Graph tags, and preview image URLs.
base_url = "https://seatwatch.fyi"
# Cloudflare Web Analytics site token (cookieless beacon); leave empty to disable.
web_analytics_token = ""
# Telegram Mini App API served by the bot behind the Cloudflare Tunnel. Leave empty
# to disable the Mini App.
miniapp_api_url = "https://bot.seatwatch.fyi/miniapp"

# Secrets are never read from this file. TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# CLOUDFLARE_API_TOKEN, and CLOUDFLARE_ACCOUNT_ID come from the environment or a
# local .env file. TELEGRAM_BOT_TEST_USER_ID is also environment-only and shows
# /test diagnostics to one operator; it does not restrict ordinary interactions
# or delivery.

[telegram_bot]
# Local webhook listener; cloudflared forwards the public hostname here. The
# public URL and secret come from TELEGRAM_WEBHOOK_URL / TELEGRAM_WEBHOOK_SECRET.
webhook_listen = "127.0.0.1"
webhook_port = 8443
retry_base_seconds = 5
retry_max_seconds = 900
per_chat_interval_seconds = 1
global_rate_per_second = 25
cleanup_interval_seconds = 3600
completed_batch_days = 90
inactive_user_days = 180

# ==============================================================================
# Registration schedule — single source of truth
# ==============================================================================
# Scheduler zones are auto-inferred:
#   extreme = [-5min, +10min] around each milestone
#   high    = [+10min, +30min] after each milestone
#   moderate = [-30min, +30min] around each deadline
# Colors are auto-assigned by priority group number.

