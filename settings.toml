# Configuration file for Registrar Monitor
timezone = "Asia/Almaty"

[directories]
text_reports = "assets/changes"
data_storage = "data"
raw_downloads = "assets/downloads"
input_files = "assets/input"
logs = "logs"

[data_source]
# University registrar data URL
url = "https://registrar.nu.edu.kz/registrar_downloads/json?method=printDocument&name=xls_school_schedule_by_term&termid=825"
# Compatibility exception for the registrar's currently unverifiable TLS chain.
# Remove this after configuring and proving a working ca_bundle path.
allow_insecure_tls = true

[notifications]
# File write delay before sending notifications (seconds)
file_write_delay = 3
# Enable/disable dry run mode
dry_run = false

[website]
# Update interval in minutes
update_interval = 30
# Cloudflare Pages project name
pages_project_name = "registrar-monitor"
# Base URL for canonical links and social sharing (default: https://{pages_project_name}.pages.dev)
base_url = ""
# Indexing directive: "noindex" prevents search engines while allowing social unfurls
indexing = "noindex"

[telegram]
# Bot token and chat ID are loaded from TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID in the environment or a local .env file.
bot_token = ""
chat_id = ""

# ==============================================================================
# Registration schedule — single source of truth
# ==============================================================================
# Scheduler zones are auto-inferred:
#   extreme = [-5min, +10min] around each milestone
#   high    = [+10min, +30min] after each milestone
#   moderate = [-30min, +30min] around each deadline
# Colors are auto-assigned by priority group number.

