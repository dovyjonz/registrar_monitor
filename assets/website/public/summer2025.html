<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Monitor - Summer 2025</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%23ff9100'/></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffd700">

    <link rel="stylesheet" href="assets/main-BpU6FKyC.css">

</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <h1>📊 Enrollment Monitor</h1>
        <nav class="semester-links" aria-label="Semester navigation">
            <a href="spring2026.html" class="semester-nav-link">Spring 2026</a>
            <a href="fall2025.html" class="semester-nav-link">Fall 2025</a>
            <a href="summer2025.html" class="semester-nav-link active" aria-current="page">Summer 2025</a>
        </nav>
        <p id="lastUpdated">Last updated 2025-12-18 23:10</p>
        <section class="stats" aria-label="Statistics">
            <div class="stat">
                <div class="stat-value" id="totalCourses">0</div>
                <div class="stat-label">Courses</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalSections">0</div>
                <div class="stat-label">Sections</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="fullSections">0</div>
                <div class="stat-label">Full</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="snapshotCount">0</div>
                <div class="stat-label">Snapshots</div>
            </div>
        </section>
        <div class="color-legend" aria-label="Fill status legend">
            <span class="legend-item legend-full">●</span> Full
            <span class="legend-item legend-near">●</span> Near Full
            <span class="legend-item legend-open">●</span> Open
        </div>
    </header>

    <!-- Unified Controls Panel -->
    <div class="controls-panel">
        <div class="controls-row">
            <input type="search" id="courseSearch" placeholder="Search courses..." aria-label="Filter courses"
                class="search-input">
            <span id="searchAnnouncement" aria-live="polite" class="visually-hidden" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;"></span>

            <div class="filter-buttons" role="group" aria-label="Filter by status">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="full">Full</button>
                <button class="filter-btn" data-filter="near">Near</button>
                <button class="filter-btn" data-filter="open">Open</button>
                <button class="filter-btn" data-filter="starred" title="Bookmarked">⭐</button>
            </div>

            <select id="sortSelect" class="sort-select" aria-label="Sort courses">
                <option value="department">By Department</option>
                <option value="code">By Code</option>
                <option value="fill-desc">Fill % (High→Low)</option>
                <option value="fill-asc">Fill % (Low→High)</option>
            </select>
        </div>

        <nav class="jump-to-nav" id="jumpToNav" aria-label="Jump to department"></nav>
    </div>

    <main id="main-content">
        <div class="course-grid" id="courseGrid" role="list" aria-label="Course list">
            <div id="loadingIndicator" style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-secondary);">
                <div style="display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: #ffd700; animation: spin 1s ease-in-out infinite;"></div>
                <p style="margin-top: 1rem; font-family: monospace;">Loading enrollment data...</p>
                <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
            </div>
        </div>
    </main>

    <!-- Toast notification container -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-header-left">
                    <button type="button" class="bookmark-btn" id="modalBookmark" aria-label="Bookmark course"
                        title="Bookmark this course">☆</button>
                    <h2 id="modalTitle">Course Details</h2>
                </div>
                <button type="button" class="close-btn" onclick="closeModal()" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="section-type-selector" id="sectionTypeSelector"></div>
                <div class="section-list" id="sectionList" role="list"></div>
                <div class="chart-container" id="chartContainer">
                    <div class="chart-placeholder" id="chartPlaceholder">
                        Click a section to view enrollment history
                    </div>
                    <canvas id="enrollment-chart" class="chart-hidden"></canvas>
                    <div class="chart-legend" id="chartLegend">
                        <div class="chart-legend-item">
                            <div class="chart-legend-dot capacity-changed"></div>
                            <span>Capacity changed</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store URL to fetch data from
        window.JSON_URL = "summer2025.json";
    </script>

    <script type="module" src="assets/main-CB8ZPS_y.js"></script>
</body>
</html>
