repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key

  # Ruff runs from the uv-locked dev dependency so its version matches uv.lock.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
        pass_filenames: true
